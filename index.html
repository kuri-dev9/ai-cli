<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>AI-CLI</title>

    <!-- Fonts: 여기에 <link> 를 박아 두지 않는다. 글꼴은 설정 > 외관에서 사용자가
         고르고(src/shared/fontSettings.ts), 고른 것만 런타임에 주입된다. 정적 링크가
         있으면 "시스템 기본" 을 고른 사용자도 쓰지 않는 웹폰트를 계속 내려받게 된다.
         CDN 은 어디까지나 선택이다: 모든 스택이 시스템 폰트(Apple SD Gothic Neo /
         Malgun Gothic / Georgia)로 끝까지 폴백하므로 오프라인·폐쇄망에서도 정상이다. -->

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials"  />
    
    <!-- iOS Safari PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AI-CLI" />
    
    <!-- iOS Safari Icons -->
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    
    <!-- Theme Color -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F3EE" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1F1E1D" />
    <meta name="msapplication-TileColor" content="#F5F3EE" />
    
    <!-- Prevent zoom on iOS -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
